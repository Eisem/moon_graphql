name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check
        run: moon check --deny-warn

      - name: Build
        run: moon build --deny-warn

      - name: Format check
        run: moon fmt --check

      - name: Info
        run: moon info

      - name: Test
        run: moon test --deny-warn

      - name: CLI smoke tests
        run: |
          moon run cmd/main
          moon run cmd/format -- "{ hero { name } }"
          if moon run cmd/format -- --check "{ hero { name } }"; then
            echo "format --check should fail for unformatted input"
            exit 1
          fi
          if moon run cmd/lint -- "{ hero { ...missing } }"; then
            echo "lint should fail for an undefined fragment"
            exit 1
          fi
